<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hostel Helpdesk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="logo-container">
        <div class="logo-circle-final">
          <i class="fa-solid fa-house house-icon"></i>
          <div class="logo-text">HOSTEL<br>HELPDESK</div>
          <div class="tagline">Your Comfort, Our Priority</div>
        </div>
      </div>

      <h2>Create Account</h2>
      <p class="subtitle">Student Registration</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>

      <div class="register-text">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
      </div>
    </section>
  </main>
</body>
</html>
