<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Hostel Helpdesk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="logo-container">
        <div class="logo-circle-final">
          <i class="fa-solid fa-house house-icon"></i>
          <div class="logo-text">HOSTEL<br>HELPDESK</div>
        </div>
      </div>

      <h2>Feedback</h2>
      <p class="subtitle">Share your experience</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;">Rating</label>
        <select name="rating" required style="width:100%; border:1px solid var(--line); background:var(--input); padding:12px 14px; border-radius:10px; outline:none; font-size:14px; color:var(--text);">
          <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
          <option value="4">⭐⭐⭐⭐ Good</option>
          <option value="3">⭐⭐⭐ Average</option>
          <option value="2">⭐⭐ Poor</option>
          <option value="1">⭐ Very Poor</option>
        </select>

        <label style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; margin-top:12px;">Message</label>
        <textarea name="message" placeholder="Your feedback" required style="width:100%; border:1px solid var(--line); background:var(--input); padding:12px 14px; border-radius:10px; outline:none; font-size:14px; color:var(--text); min-height:120px; resize:vertical;"></textarea>

        <button type="submit" style="margin-top:18px;">Send Feedback</button>
      </form>

      <a href="{{ url_for('student_dashboard') }}" style="margin-top:16px;">← Back to Dashboard</a>
    </section>
  </main>
</body>
</html>
